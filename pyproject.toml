[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "asr-stream2txt"
version = "0.2.0"
description = "Realtime macOS microphone transcription with mlx-audio"
requires-python = ">=3.12"
dependencies = [
  "mlx-audio==0.4.1",
  "numpy>=2.4.3",
  "sounddevice>=0.5.3",
]

[project.scripts]
asr-stream2txt = "asr_stream2txt.cli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["asr_stream2txt*"]
